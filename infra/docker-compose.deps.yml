# Postgres + Redis only (for local hybrid dev: run API + Vite on host)
#   docker compose -f infra/docker-compose.deps.yml up -d
#
# For the full stack (Postgres + API + UI in Docker), use:
#   docker compose -f infra/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mci
      POSTGRES_PASSWORD: mci
      POSTGRES_DB: mci_workforce
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mci -d mci_workforce"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
